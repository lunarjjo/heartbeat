name: Pulse

on:
  schedule:
    - cron: "7 * * * *"   # setiap jam, menit ke-7
  workflow_dispatch:        # bisa dipicu manual / via API

permissions:
  contents: write           # izinkan commit hasil pulsa

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update pulse v2 (status, watch pemilik, ide, tren, jurnal, badge)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # token bawaan Actions — bukan PAT pemilik
        run: python3 pulse.py

      - name: Commit & push
        run: |
          git config user.name  "lunarjjo-agent"
          git config user.email "313322027+lunarjjo@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "tidak ada perubahan — lewati commit"
          else
            git commit -m "pulse: $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi
